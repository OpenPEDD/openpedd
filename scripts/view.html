<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenPEDD Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky tab bar over four views of the same spec: the cycle as a line of stages with its data flow, the documents as a graph, the architecture as two stacked layers, and the gaps as a list */
:root{
  --bg:#f3f5f6; --surface:#fff; --ink:#15202b; --muted:#5b6873; --line:#d5dce1;
  --accent:#1f6f8b; --accent-soft:#e1eef3; --judge:#8a4b14; --judge-soft:#f6eadf;
  --human:#5b3fa0; --human-soft:#ece7f7; --warn:#a3361f; --warn-soft:#f8e4df;
  --l1:#1f6f8b; --l2:#8a4b14; --l3:#5b3fa0; --l4:#2f7d4f; --l5:#a3361f; --l6:#7a6a12; --l7:#3d5a99; --l8:#8c3b6e; --l9:#4f6470; --l10:#2b7a78; --l11:#9a5a2b;
  --display:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172026; --ink:#e4eaee; --muted:#93a1ab; --line:#2a363e;
  --accent:#6cb9d4; --accent-soft:#16323d; --judge:#e0a46c; --judge-soft:#3a2818;
  --human:#b9a3ef; --human-soft:#2c2442; --warn:#f08c74; --warn-soft:#3d1f18;
  --l1:#6cb9d4; --l2:#e0a46c; --l3:#b9a3ef; --l4:#7ccf9b; --l5:#f08c74; --l6:#d8c45a; --l7:#8fa9e8; --l8:#e08bc0; --l9:#9fb3bf; --l10:#6fd0cc; --l11:#e3a273; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --ink:#e4eaee; --muted:#93a1ab; --line:#2a363e;
  --accent:#6cb9d4; --accent-soft:#16323d; --judge:#e0a46c; --judge-soft:#3a2818;
  --human:#b9a3ef; --human-soft:#2c2442; --warn:#f08c74; --warn-soft:#3d1f18;
  --l1:#6cb9d4; --l2:#e0a46c; --l3:#b9a3ef; --l4:#7ccf9b; --l5:#f08c74; --l6:#d8c45a; --l7:#8fa9e8; --l8:#e08bc0; --l9:#9fb3bf; --l10:#6fd0cc; --l11:#e3a273; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-size:1rem;margin:0}
p{margin:0;max-width:72ch}
.muted{color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.84em}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding-block:12px}
nav .brand{font-weight:700;margin-right:12px}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;font-weight:500}
nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
nav a .n{font-family:var(--mono);font-size:.75rem;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px;margin-left:6px}
nav .built{margin-left:auto;font-size:.78rem;color:var(--muted)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.layer[aria-pressed="true"]{background:var(--surface);border-color:var(--muted);color:var(--ink)}
.pill.layer[aria-pressed="false"]{opacity:.45}
.chip{font-family:var(--mono);font-size:.7rem;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.chip.j{background:var(--judge-soft);color:var(--judge)}
.scroll{overflow-x:auto}
.sub{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface);gap:2px;align-self:flex-start}
.sub button{font:inherit;font-size:.86rem;border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer}
.sub button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toolbar{display:flex;flex-direction:column;gap:12px}
/* Process: swimlanes */
.lanes{display:grid;grid-template-columns:120px repeat(10,148px);width:max-content;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.lanes>div{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px;min-height:46px}
.lanes .lh{border-left:0;background:var(--bg);font-size:.78rem;font-weight:600;color:var(--muted);justify-content:center}
.lanes .lh small{font-weight:400;font-size:.72rem}
.lanes .colh{border-top:0;cursor:pointer;background:var(--bg)}
.lanes .colh b{font-family:var(--mono)}
.lanes .colh.sel{background:var(--accent-soft)}
.lanes .corner{border-top:0;border-left:0;background:var(--bg)}
.lanes .off{opacity:.25}
.lanes .note{font-size:.76rem;color:var(--muted)}
.lanes .runs{font-size:.74rem;border:0;padding:0;margin:0}
.chip.t{background:var(--bg);color:var(--muted);border:1px solid var(--line);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
[hidden]{display:none!important}
.chip.p{background:var(--human-soft);color:var(--human)}
.mode{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;align-self:flex-start;background:var(--accent-soft);color:var(--accent)}
.mode.h{background:var(--human-soft);color:var(--human)}
.runs{font-size:.75rem;color:var(--muted)}
.runs.partial{color:var(--judge)}
/* Matrices */
.matrix{border-collapse:separate;border-spacing:3px;font-size:.8rem;width:auto}
.matrix th{font-family:var(--mono);font-size:.74rem;text-transform:none;letter-spacing:0;padding:4px 6px;white-space:nowrap;color:var(--ink);font-weight:500}
.matrix thead th{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;vertical-align:bottom;height:96px}
.matrix th.rh{text-align:right}
.matrix td{width:46px;height:40px;text-align:center;border:0;border-radius:6px;background:var(--bg);cursor:pointer;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:0}
.matrix td.diag{background:var(--line);cursor:default}
.matrix td.fwd{background:var(--accent-soft);color:var(--accent)}
.matrix td.back{background:var(--judge-soft);color:var(--judge);font-weight:600}
.matrix td.sel{outline:2px solid var(--ink)}
.matrix td.empty{cursor:default;color:transparent}
.mxwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.mxwrap{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.panel.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:820px){.panel{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:4px 8px}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto}
/* Concepts: documents in columns */
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(170px,1fr));gap:10px;width:max-content;min-width:100%}
.lcol{display:flex;flex-direction:column;gap:3px;min-width:0}
.lcol h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:6px;padding-bottom:4px;border-bottom:2px solid var(--line);margin-bottom:4px}
.doc{font:inherit;font-size:.8rem;text-align:left;border:1px solid transparent;background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 7px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;width:170px}
.doc span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .c{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.cols.has .doc{opacity:.28}
.cols.has .doc.me{opacity:1;border-color:var(--ink);font-weight:600}
.cols.has .doc.out{opacity:1;background:var(--accent-soft);color:var(--accent)}
.cols.has .doc.in{opacity:1;background:var(--judge-soft);color:var(--judge)}
.cols.has .doc.out.in{background:var(--human-soft);color:var(--human)}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:220px}
.side a,.panel a{color:var(--accent);cursor:pointer;text-decoration:none}
.panel ul{margin:0;padding-left:18px;font-size:.86rem}
/* Architecture: context diagram */
.c4{display:flex;flex-direction:column;align-items:stretch;gap:0}
.sys{border:1.5px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.sys.cloud{border-style:dashed;border-color:var(--judge)}
.sys h2 small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:8px}
.wires{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.wire{display:flex;flex-direction:column;align-items:center}
.wire .ln{width:2px;height:26px;background:var(--muted)}
.wire .lbl{font-family:var(--mono);font-size:.7rem;color:var(--judge);background:var(--bg);padding:0 4px;margin-block:-2px}
.wire .ext{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:.86rem;font-weight:600;text-align:center;width:100%}
.wire .ext small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.piece{border:1px solid var(--line);border-radius:9px;padding:11px;display:flex;flex-direction:column;gap:5px;min-width:0;background:var(--bg)}
.piece b{font-family:var(--mono);font-size:.86rem}
.piece ul{margin:2px 0 0;padding-left:16px;font-size:.8rem}
.cross{display:flex;flex-direction:column;gap:8px}
/* Gaps */
.gap{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gap .k{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
@media (prefers-reduced-motion:reduce){.stage{transition:none}}
</style>
</head>
<body>
<nav aria-label="Views">
  <span class="brand">OpenPEDD map</span>
  <a href="#process">Process</a><a href="#concepts">Concepts</a><a href="#architecture">Architecture</a><a href="#gaps">Gaps</a>
  <span class="built" id="built"></span>
</nav>
<main class="wrap" id="main"></main>
<script>
const D=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const md=s=>esc(s).replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
const codes=s=>[...String(s||"").matchAll(/`([^`]+)`/g)].map(m=>m[1]);
const table=(rows,head)=>rows.length?`<div class="tbl"><table>${head?`<tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>`:""}${rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join("")}</tr>`).join("")}</table></div>`:"";
$("#built").textContent="Built from the spec on "+D.built;

const sub=(key,opts,cur)=>`<div class="sub" role="group">${opts.map(([k,l])=>`<button data-sub="${key}:${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</div>`;
const stageIdx=Object.fromEntries(D.stages.map((s,i)=>[s.id,i]));

/* ---------------- Process ---------------- */
const st={mode:"lanes",change:-1,sel:"specify",cell:null};
function runOf(stage){
  if(st.change<0) return {txt:"",cls:""};
  const c=D.changes[st.change].cells;
  for(const [col,val] of Object.entries(c)){
    const ids=col==="plan → verify"?["plan","build","verify"]:col.split(" → ");
    if(!ids.includes(stage)) continue;
    const v=val.trim();
    if(v==="—"||v==="") return {txt:"Does not run",cls:"off"};
    if(v==="✓") return {txt:"Runs",cls:""};
    const order=D.stages.map(x=>x.id), r=v.match(/`(\w+)`\s*→\s*`(\w+)`/);
    if(r&&order.includes(r[1])&&order.includes(r[2])){const i=order.indexOf(stage);
      return i>=order.indexOf(r[1])&&i<=order.indexOf(r[2])?{txt:"Runs",cls:""}:{txt:"Does not run",cls:"off"};}
    return {txt:v,cls:"partial"};
  }
  return {txt:"Not in the tracks table",cls:"outside"};
}
const isHuman=m=>/interactive|human|guided/i.test(m);
const personOf=s=>{const out=[];
  if(/human/i.test(s.mode)) out.push("Decides every assumption and deviation");
  else if(/interactive/i.test(s.mode)) out.push("Works with the agent");
  else if(/guided/i.test(s.mode)) out.push("Guides, or delegates");
  if(/approv/i.test(s.judgeText)) out.push("Approves");
  return out;};
function process(){
  $("#main").innerHTML=`
  <section class="intro"><span class="label">Process · from modules/cycle, modules/tracks and each stage's PRD</span>
    <h1>The cycle, stage by stage</h1>
    <p class="muted">Two ways to read the same cycle. <b>Lanes</b>: who does what in each stage, one row per actor. <b>Dependencies</b>: which stage feeds which, as a matrix; anything above the diagonal is work that goes back.</p></section>
  <section class="toolbar">${sub("p",[["lanes","Lanes"],["dsm","Dependencies"]],st.mode)}
  ${st.mode==="lanes"?`<div class="chips" role="group" aria-label="Kind of change">
    <button class="pill" data-c="-1" aria-pressed="${st.change<0}">Every stage</button>
    ${D.changes.map((c,i)=>`<button class="pill" data-c="${i}" aria-pressed="${st.change===i}">${c.track?`<code>${c.track}</code> · `:""}${md(c.touches.replace(/\s*\(`[^)]*`\)/,""))}</button>`).join("")}</div>`:""}</section>
  <div class="scroll" id="pview"></div>
  <section class="panel" id="panel"></section>`;
  st.mode==="lanes"?lanes():dsm();
}
function lanes(){
  const S=D.stages, cls=s=>runOf(s.id).cls==="off"?"off":"";
  const row=(head,fn)=>`<div class="lh">${head}</div>`+S.map(s=>`<div class="${cls(s)}">${fn(s)}</div>`).join("");
  $("#pview").innerHTML=`<div class="lanes">
    <div class="corner"></div>${S.map(s=>{const r=runOf(s.id);return `<div class="colh ${cls(s)} ${s.id===st.sel?"sel":""}" data-s="${s.id}" role="button" tabindex="0">
      <span class="mono muted" style="font-size:.7rem">${String(s.n).padStart(2,"0")}</span><b>${s.id}</b><span class="mode ${isHuman(s.mode)?"h":""}">${md(s.mode)}</span>
      ${r.txt?`<span class="runs ${r.cls==="partial"?"partial":""}">${md(r.txt)}</span>`:""}</div>`;}).join("")}
    ${row("Person",s=>personOf(s).map(t=>`<span class="chip p" style="font-family:var(--display)">${t}</span>`).join(""))}
    ${row("Agent<br><small>skills it runs</small>",s=>s.tools.filter(t=>t[0]==="Skill").flatMap(t=>codes(t[1])).map(k=>`<span class="chip">${esc(k)}</span>`).join(""))}
    ${row("Judge<br><small>another session</small>",s=>s.judges.length?s.judges.flatMap(j=>codes(j[0])).map(k=>`<span class="chip j">${esc(k)}</span>`).join(""):`<span class="note">${md(s.judgeText.split(/[.:]/)[0])}</span>`)}
    ${row("Tools<br><small>MCP and tools</small>",s=>s.tools.filter(t=>t[0]!=="Skill"&&t[0]!=="Agent").map(t=>`<span class="chip t" title="${esc(t[2].replace(/`/g,""))}">${md(t[0]==="MCP"?t[1]:t[1].replace(/\s*\(.*$/,"")).replace(/<\/?code>/g,"")}</span>`).join(""))}
    ${row("Leaves",s=>`<span class="note">${s.outputs.length} outputs</span>${s.outputs.slice(0,3).map(o=>`<span class="note" style="color:var(--ink)">${md(o[0])}</span>`).join("")}`)}
  </div>`;
  panel();
}
function dsm(){
  const S=D.stages, m={};
  D.flows.forEach(f=>{const k=f.to+"|"+f.from;(m[k]=m[k]||[]).push(f.what);});
  const back=D.flows.filter(f=>stageIdx[f.from]>stageIdx[f.to]).length;
  $("#pview").innerHTML=`<div class="mxwrap"><div class="tbl"><table class="matrix" aria-label="Which stage feeds which">
    <thead><tr><th style="writing-mode:horizontal-tb;transform:none;vertical-align:bottom;font-family:var(--display);color:var(--muted);font-size:.72rem">receives ↓ · from →</th>${S.map(s=>`<th>${s.id}</th>`).join("")}</tr></thead>
    ${S.map((r,i)=>`<tr><th class="rh">${r.id}</th>${S.map((c,j)=>{const k=r.id+"|"+c.id, v=m[k];
      if(i===j) return `<td class="diag"></td>`;
      if(!v) return `<td class="empty"></td>`;
      return `<td class="${j>i?"back":"fwd"} ${st.cell===k?"sel":""}" data-cell="${k}" title="${esc(c.id+" → "+r.id)}">${v.length}</td>`;}).join("")}</tr>`).join("")}
  </table></div>
  <div class="col"><div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Forward: an earlier stage feeds a later one</span><span><i style="background:var(--judge-soft);border:1px solid var(--judge)"></i>Back: a later stage feeds an earlier one</span></div>
    <p class="muted" style="font-size:.88rem">${D.flows.length} inputs declared between stages, ${back} going back. A stage with an empty column feeds nobody by declaration; one with an empty row reads only from outside the cycle. Tap a cell to read what flows.</p>
    <div id="cellinfo"></div></div></div>`;
  cellInfo();
  $("#panel").hidden=true;
}
function cellInfo(){
  const el=$("#cellinfo");if(!el)return;
  if(!st.cell){el.innerHTML="";return;}
  const [to,from]=st.cell.split("|");
  el.innerHTML=`<div class="panel one"><div class="col"><span class="label">${from} → ${to}</span>
    <ul>${D.flows.filter(f=>f.from===from&&f.to===to).map(f=>`<li>${md(f.what)}</li>`).join("")}</ul></div></div>`;
}
function panel(){
  const p=$("#panel");p.hidden=false;
  const s=D.stages.find(x=>x.id===st.sel), r=runOf(s.id);
  const feeds=D.flows.filter(f=>f.from===s.id);
  p.innerHTML=`<div class="col">
      <div><span class="label">Stage ${s.n} · ${md(s.mode)}</span><h2 class="mono">${s.id}</h2></div>
      <p>${md(s.what||s.does)}</p>
      ${r.txt?`<p><span class="label">In this change</span><br>${md(r.txt)}</p>`:""}
      <div><span class="label">Inputs</span>${table(s.inputs,["What","From"])}</div>
      <div><span class="label">Outputs</span>${table(s.outputs,["What","Anchored to / where"])}</div>
      <div><span class="label">Feeds</span><p class="muted" style="font-size:.86rem">${feeds.length?[...new Set(feeds.map(f=>f.to))].map(x=>`<code>${x}</code>`).join(" · "):"No stage declares an input from this one"}</p></div>
    </div>
    <div class="col">
      <div><span class="label">Judge</span>${s.judges.length?table(s.judges,["Agent","Checks","Passes when"]):""}${s.judgeText?`<p style="font-size:.88rem;margin-top:6px">${md(s.judgeText)}</p>`:""}</div>
      <div><span class="label">Skills, agents and tools</span>${table(s.tools,["Kind","Name","For"])}</div>
      <div><span class="label">Per track</span>${s.perTrack===null?`<p class="muted" style="font-size:.86rem">This PRD has no "Per track" section.</p>`:table(s.perTrack,["Track","What changes"])}</div>
      <p class="muted" style="font-size:.8rem">Source: <code>${s.path}</code></p>
    </div>`;
}

/* ---------------- Concepts ---------------- */
const known=new Set(D.docs.map(d=>d.layer));
const layers=[...D.readingOrder.filter(l=>known.has(l)),...[...known].filter(l=>!D.readingOrder.includes(l))];
const layerColor=Object.fromEntries(layers.map((l,i)=>[l,`var(--l${i%11+1})`]));
const byPath=Object.fromEntries(D.docs.map(d=>[d.path,d]));
const cs={mode:"layers",sel:null,cell:null,q:""};
function concepts(){
  $("#main").innerHTML=`
  <section class="intro"><span class="label">Concepts · every document of the spec and every link between them</span>
    <h1>How the spec holds together</h1>
    <p class="muted">Layers are in the spec's own reading order, from the business to the open questions. <b>Layers</b>: how many links go from each layer to each other. <b>Documents</b>: every document in its layer; pick one to light up what it cites and what cites it.</p></section>
  <section class="toolbar">${sub("c",[["layers","Layers"],["docs","Documents"]],cs.mode)}</section>
  <div id="cview"></div>`;
  cs.mode==="layers"?layerMatrix():docCols();
}
function layerMatrix(){
  const m={};D.docs.forEach(d=>d.links.forEach(l=>{const k=d.layer+"|"+byPath[l.to].layer;(m[k]=m[k]||[]).push([d.path,l.to]);}));
  const max=Math.max(...Object.values(m).map(v=>v.length));
  const shade=n=>`color-mix(in srgb, var(--accent) ${Math.round(12+n/max*70)}%, var(--surface))`;
  $("#cview").innerHTML=`<div class="mxwrap"><div class="tbl"><table class="matrix" aria-label="Links between layers">
    <thead><tr><th style="writing-mode:horizontal-tb;transform:none;vertical-align:bottom;font-family:var(--display);color:var(--muted);font-size:.72rem">from ↓ · to →</th>${layers.map(l=>`<th><span class="sw" style="background:${layerColor[l]}"></span> ${l}</th>`).join("")}</tr></thead>
    ${layers.map(a=>`<tr><th class="rh">${a} <span class="sw" style="background:${layerColor[a]}"></span></th>${layers.map(b=>{const k=a+"|"+b,v=m[k]||[];
      if(!v.length) return `<td class="empty"></td>`;
      const dark=v.length/max>.55;
      return `<td data-lcell="${k}" class="${cs.cell===k?"sel":""}" style="background:${shade(v.length)};color:${dark?"var(--surface)":"var(--ink)"}">${v.length}</td>`;}).join("")}</tr>`).join("")}
  </table></div>
  <div class="col"><p class="muted" style="font-size:.88rem">Each cell counts the links from documents of one layer to documents of another. Rows show what a layer leans on; columns show who leans on it. Tap a cell to list the links.</p><div id="lcellinfo"></div></div></div>`;
  lcellInfo(m);
}
function lcellInfo(m){
  const el=$("#lcellinfo");if(!el||!cs.cell){if(el)el.innerHTML="";return;}
  const v=m[cs.cell]||[];const [a,b]=cs.cell.split("|");
  el.innerHTML=`<div class="panel one"><div class="col"><span class="label">${a} → ${b} · ${v.length} links</span>
    <ul>${v.map(([f,t])=>`<li><a data-go="${esc(f)}">${esc(byPath[f].title)}</a> → <a data-go="${esc(t)}">${esc(byPath[t].title)}</a></li>`).join("")}</ul></div></div>`;
}
function docCols(){
  const d=byPath[cs.sel], outs=new Set(d?d.links.map(l=>l.to):[]), ins=new Set(d?D.docs.filter(x=>x.links.some(l=>l.to===d.path)).map(x=>x.path):[]);
  const q=cs.q.toLowerCase();
  const cols=layers.map(l=>{const ds=D.docs.filter(x=>x.layer===l).sort((a,b)=>b.incoming-a.incoming);
    return `<div class="lcol"><h3><span class="sw" style="background:${layerColor[l]}"></span>${l} <span class="mono" style="font-weight:400">${ds.length}</span></h3>
    ${ds.map(x=>{const hit=q&&(x.title+" "+x.ids.join(" ")).toLowerCase().includes(q);
      const c=[x.path===cs.sel?"me":"",outs.has(x.path)?"out":"",ins.has(x.path)?"in":""].join(" ");
      return `<button class="doc ${c}" data-go="${esc(x.path)}" title="${esc(x.title+" — "+x.description)}" ${hit?'style="outline:2px solid var(--accent)"':""}><span>${esc(x.title)}</span><span class="c">${x.incoming}</span></button>`;}).join("")}</div>`;}).join("");
  $("#cview").innerHTML=`<div class="chips"><input type="search" id="q" placeholder="Find a document or ID" value="${esc(cs.q)}" aria-label="Find a document or ID">
    <div class="legend"><span><i style="background:var(--accent-soft)"></i>It cites</span><span><i style="background:var(--judge-soft)"></i>Cites it</span><span><i style="background:var(--human-soft)"></i>Both</span><span class="mono">n = cited by</span></div></div>
    <div class="scroll" style="margin-top:12px"><div class="cols ${d?"has":""}" style="--n:${layers.length}">${cols}</div></div>
    ${d?`<section class="panel" style="margin-top:16px"><div class="col"><span class="label"><span class="sw" style="background:${layerColor[d.layer]}"></span> ${d.layer}${d.status?" · "+d.status:""}</span>
      <h2>${esc(d.title)}</h2><p>${md(d.description)}</p>${d.ids.length?`<div class="chips">${d.ids.map(i=>`<span class="chip">${i}</span>`).join("")}</div>`:""}
      <p class="muted mono" style="font-size:.75rem">${esc(d.path)} · v${esc(d.version)} · ${esc(d.updated)}</p><a data-go="">Clear selection</a></div>
      <div class="col"><span class="label">Cites ${outs.size}</span><ul>${[...outs].map(p=>`<li><a data-go="${esc(p)}">${esc(byPath[p].title)}</a> <span class="muted">· ${byPath[p].layer}</span></li>`).join("")||"<li class='muted'>None</li>"}</ul>
      <span class="label">Cited by ${ins.size}</span><ul>${[...ins].map(p=>`<li><a data-go="${esc(p)}">${esc(byPath[p].title)}</a> <span class="muted">· ${byPath[p].layer}</span></li>`).join("")||"<li class='muted'>None</li>"}</ul></div></section>`:""}`;
}

/* ---------------- Architecture ---------------- */
function architecture(){
  const pieceDocs=new Set(D.pieces.flatMap(p=>p.docs));
  const home={};
  D.archDocs.filter(d=>!pieceDocs.has(d.path)).forEach(d=>{
    (home[""]=home[""]||[]).push(d);});
  const pieceOf=name=>D.pieces.find(p=>p.piece.replace(/`[^`]*`/g,"").trim().toLowerCase()===name.toLowerCase());
  $("#main").innerHTML=`
  <section class="intro"><span class="label">Architecture · a context diagram, from foundations/architecture/overview.md</span>
    <h1>The pieces, and what connects them</h1>
    <p class="muted">Read it from the top: the Cloud watches the outside systems through the connection named on each wire. Below, the open framework, which runs on your machine when you ask. Each piece lists the document its row in the overview points to. The overview says which outside system the Cloud reaches and how; it does not yet say which open piece talks to which, so no wire is drawn there.</p></section>
  <section class="c4">
    <div class="sys cloud"><h2>OpenPEDD Cloud<small>paid · watches all the time, across systems</small></h2>
      <div class="chips">${D.cloud.map(c=>`<span class="chip j">${esc(c)}</span>`).join("")}</div></div>
    <div class="wires" style="--n:${D.connections.length}">${D.connections.map(c=>`<div class="wire"><span class="ln"></span>${c.via?`<span class="lbl">${esc(c.via)}</span>`:`<span class="lbl" style="color:var(--muted)">—</span>`}<span class="ln"></span>
      <div class="ext">${esc(c.name)}<small>outside system</small></div></div>`).join("")}</div>
    <div class="sys"><h2>OpenPEDD<small>open source · runs when you ask</small></h2>
      <div class="grid">${D.openLayers.map(l=>{const p=pieceOf(l.name);const docs=[...(p?.docs||[]).map(x=>byPath[x]),...(p?home[p.piece]||[]:[])].filter(Boolean);
        return `<div class="piece"><span class="label">${l.n}</span><b>${esc(l.name)}</b>${p?`<span style="font-size:.86rem">${md(p.does)}</span>`:""}
        <span class="muted" style="font-size:.76rem">${md(l.items)}</span>
        ${docs.length?`<ul>${docs.map(d=>`<li>${esc(d.title)}${d.ids[0]?` <span class="muted mono" style="font-size:.7rem">${d.ids[0]}</span>`:""}</li>`).join("")}</ul>`:""}</div>`;}).join("")}</div></div>
  </section>
  ${home[""]?.length?`<section class="cross"><h2>Other architecture documents</h2><p class="muted" style="font-size:.88rem">The overview does not tie these to a piece.</p><div class="grid">${home[""].map(d=>`<div class="piece"><span class="label">${d.ids[0]||""}</span><b style="font-family:var(--display);font-size:.95rem">${esc(d.title)}</b><span style="font-size:.84rem" class="muted">${md(d.description)}</span></div>`).join("")}</div></section>`:""}`;
}

/* ---------------- Gaps ---------------- */
function gaps(){
  $("#main").innerHTML=`
  <section class="intro"><span class="label">Gaps · computed when the map is built</span>
    <h1>What the spec says about itself that does not add up</h1>
    <p class="muted">Each line compares two places in the spec that should agree: the tracks table and each stage's PRD, the published skill and judge lists and each PRD, and documents nothing links to. A gap is a question for <code>specify</code>, not a verdict.</p></section>
  <section style="display:flex;flex-direction:column;gap:8px">${D.gaps.length?D.gaps.map(g=>`<div class="gap"><span class="k">${g.kind}</span><div><div>${md(g.text)}</div><div class="muted mono" style="font-size:.75rem">${esc(g.where)}</div></div></div>`).join(""):"<p>No gaps found.</p>"}</section>`;
}

/* ---------------- Routing and events ---------------- */
const views={process,concepts,architecture,gaps};
function route(){
  const v=views[location.hash.slice(1)]?location.hash.slice(1):"process";
  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));
  views[v]();
}
document.querySelector('nav a[href="#gaps"]').insertAdjacentHTML("beforeend",D.gaps.length?`<span class="n">${D.gaps.length}</span>`:"");
document.addEventListener("click",e=>{
  const sb=e.target.closest("[data-sub]");if(sb){const [k,v]=sb.dataset.sub.split(":");if(k==="p")st.mode=v;else cs.mode=v;route();return;}
  const c=e.target.closest("[data-c]");if(c){st.change=+c.dataset.c;process();return;}
  const s=e.target.closest("[data-s]");if(s){st.sel=s.dataset.s;lanes();return;}
  const cell=e.target.closest("[data-cell]");if(cell){st.cell=cell.dataset.cell;dsm();return;}
  const lc=e.target.closest("[data-lcell]");if(lc){cs.cell=lc.dataset.lcell;layerMatrix();return;}
  const g=e.target.closest("[data-go]");if(g){cs.sel=g.dataset.go||null;if(cs.mode!=="docs"&&cs.sel){cs.mode="docs";}concepts();return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-s]"))e.target.click();});
document.addEventListener("input",e=>{if(e.target.id==="q"){cs.q=e.target.value;docCols();const q=$("#q");q.focus();q.setSelectionRange(q.value.length,q.value.length);}});
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
