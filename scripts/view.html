<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenPEDD Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky tab bar over four views of the same spec: the cycle as a line of stages with its data flow, the documents as a graph, the architecture as two stacked layers, and the gaps as a list */
:root{
  --bg:#f3f5f6; --surface:#fff; --ink:#15202b; --muted:#5b6873; --line:#d5dce1;
  --accent:#1f6f8b; --accent-soft:#e1eef3; --judge:#8a4b14; --judge-soft:#f6eadf;
  --human:#5b3fa0; --human-soft:#ece7f7; --warn:#a3361f; --warn-soft:#f8e4df;
  --l1:#1f6f8b; --l2:#8a4b14; --l3:#5b3fa0; --l4:#2f7d4f; --l5:#a3361f; --l6:#7a6a12; --l7:#3d5a99; --l8:#8c3b6e; --l9:#4f6470; --l10:#2b7a78; --l11:#9a5a2b;
  --display:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172026; --ink:#e4eaee; --muted:#93a1ab; --line:#2a363e;
  --accent:#6cb9d4; --accent-soft:#16323d; --judge:#e0a46c; --judge-soft:#3a2818;
  --human:#b9a3ef; --human-soft:#2c2442; --warn:#f08c74; --warn-soft:#3d1f18;
  --l1:#6cb9d4; --l2:#e0a46c; --l3:#b9a3ef; --l4:#7ccf9b; --l5:#f08c74; --l6:#d8c45a; --l7:#8fa9e8; --l8:#e08bc0; --l9:#9fb3bf; --l10:#6fd0cc; --l11:#e3a273; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --ink:#e4eaee; --muted:#93a1ab; --line:#2a363e;
  --accent:#6cb9d4; --accent-soft:#16323d; --judge:#e0a46c; --judge-soft:#3a2818;
  --human:#b9a3ef; --human-soft:#2c2442; --warn:#f08c74; --warn-soft:#3d1f18;
  --l1:#6cb9d4; --l2:#e0a46c; --l3:#b9a3ef; --l4:#7ccf9b; --l5:#f08c74; --l6:#d8c45a; --l7:#8fa9e8; --l8:#e08bc0; --l9:#9fb3bf; --l10:#6fd0cc; --l11:#e3a273; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-size:1rem;margin:0}
p{margin:0;max-width:72ch}
.muted{color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.84em}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding-block:12px}
nav .brand{font-weight:700;margin-right:12px}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;font-weight:500}
nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
nav a .n{font-family:var(--mono);font-size:.75rem;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px;margin-left:6px}
nav .built{margin-left:auto;font-size:.78rem;color:var(--muted)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.layer[aria-pressed="true"]{background:var(--surface);border-color:var(--muted);color:var(--ink)}
.pill.layer[aria-pressed="false"]{opacity:.45}
.chip{font-family:var(--mono);font-size:.7rem;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.chip.j{background:var(--judge-soft);color:var(--judge)}
.scroll{overflow-x:auto}
/* Process */
.stages{display:grid;grid-template-columns:repeat(10,150px);gap:18px;width:max-content;padding:2px}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:7px;
  cursor:pointer;text-align:left;font:inherit;color:inherit;transition:opacity .2s}
.stage:not(:last-child)::after{content:"";position:absolute;right:-17px;top:26px;width:16px;height:2px;background:var(--line)}
.stage[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stage.off{opacity:.3}.stage.outside{border-style:dashed}
.stage .name{font-weight:700;font-family:var(--mono)}
.mode{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;align-self:flex-start;background:var(--accent-soft);color:var(--accent)}
.mode.h{background:var(--human-soft);color:var(--human)}
.runs{font-size:.75rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.runs.partial{color:var(--judge)}
svg text{font-family:var(--display)}
.arc{fill:none;stroke-width:1.6;opacity:.55;cursor:pointer}
.arc:hover,.arc.hl{opacity:1;stroke-width:3}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:820px){.panel{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:4px 8px}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto}
.flowhint{font-size:.85rem;color:var(--muted);min-height:1.4em}
/* Concepts */
.graphwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media (max-width:900px){.graphwrap{grid-template-columns:minmax(0,1fr)}}
.graph{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:640px;touch-action:none}
.graph svg{width:100%;height:100%;cursor:grab}
.node circle{stroke:var(--surface);stroke-width:1.5;cursor:pointer}
.node text{font-size:12px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.edge{stroke:var(--line);stroke-width:1}
.dim{opacity:.12}
.edge.hl{stroke:var(--accent);stroke-width:1.6;opacity:1}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:640px;overflow:auto;min-width:0}
.side a{color:var(--accent);cursor:pointer;text-decoration:none}
.side ul{margin:0;padding-left:18px;font-size:.86rem}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:220px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
/* Architecture */
.tier{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.tier.cloud{border-style:dashed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.piece{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--bg)}
.piece b{font-family:var(--mono);font-size:.85rem}
.ext{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:.85rem;color:var(--muted)}
.ext span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--ink)}
/* Gaps */
.gap{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gap .k{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
@media (prefers-reduced-motion:reduce){.stage{transition:none}}
</style>
</head>
<body>
<nav aria-label="Views">
  <span class="brand">OpenPEDD map</span>
  <a href="#process">Process</a><a href="#concepts">Concepts</a><a href="#architecture">Architecture</a><a href="#gaps">Gaps</a>
  <span class="built" id="built"></span>
</nav>
<main class="wrap" id="main"></main>
<script>
const D=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const md=s=>esc(s).replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
const codes=s=>[...String(s||"").matchAll(/`([^`]+)`/g)].map(m=>m[1]);
const table=(rows,head)=>rows.length?`<div class="tbl"><table>${head?`<tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>`:""}${rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join("")}</tr>`).join("")}</table></div>`:"";
$("#built").textContent="Built from the spec on "+D.built;

/* ---------------- Process ---------------- */
const st={change:-1,sel:"specify"};
function runOf(stage){
  if(st.change<0) return {txt:"",cls:""};
  const c=D.changes[st.change].cells;
  for(const [col,val] of Object.entries(c)){
    const ids=col==="plan → verify"?["plan","build","verify"]:col.split(" → ");
    if(!ids.includes(stage)) continue;
    const v=val.trim();
    if(v==="—"||v==="") return {txt:"Does not run",cls:"off"};
    if(v==="✓") return {txt:"Runs",cls:""};
    const order=D.stages.map(x=>x.id), r=v.match(/`(\w+)`\s*→\s*`(\w+)`/);
    if(r&&order.includes(r[1])&&order.includes(r[2])){const i=order.indexOf(stage);
      return i>=order.indexOf(r[1])&&i<=order.indexOf(r[2])?{txt:v,cls:"partial"}:{txt:"Does not run",cls:"off"};}
    return {txt:v,cls:"partial"};
  }
  return {txt:"Not in the tracks table",cls:"outside"};
}
const isHuman=m=>/interactive|human|guided/i.test(m);
function process(){
  const W=168, n=D.stages.length;
  const idx=Object.fromEntries(D.stages.map((s,i)=>[s.id,i]));
  const cx=i=>i*W+75;
  const arcs=D.flows.map((f,k)=>{
    const a=cx(idx[f.from]),b=cx(idx[f.to]),fwd=b>a,h=Math.min(118,24+Math.abs(b-a)*.16);
    const y=fwd?125:125, d=`M${a},${y} C${a},${fwd?y-h:y+h} ${b},${fwd?y-h:y+h} ${b},${y}`;
    return `<path class="arc" data-k="${k}" data-from="${f.from}" data-to="${f.to}" d="${d}" stroke="${fwd?"var(--accent)":"var(--judge)"}"><title>${esc(f.from+" → "+f.to+": "+f.what.replace(/`/g,""))}</title></path>`;
  }).join("");
  const dots=D.stages.map((s,i)=>`<circle cx="${cx(i)}" cy="125" r="5" fill="var(--ink)"/><text x="${cx(i)}" y="146" text-anchor="middle" font-size="11" fill="var(--muted)">${s.id}</text>`).join("");
  $("#main").innerHTML=`
  <section class="intro"><span class="label">Process · from modules/cycle, modules/tracks and each stage's PRD</span>
    <h1>The cycle, stage by stage</h1>
    <p class="muted">Pick a kind of change to see which stages it runs. Pick a stage to see what it reads, what it leaves, who judges it and with which skills. The arcs below are the real inputs each stage declares: blue goes forward, orange goes back.</p></section>
  <section class="chips" role="group" aria-label="Kind of change">
    <button class="pill" data-c="-1" aria-pressed="${st.change<0}">Every stage</button>
    ${D.changes.map((c,i)=>`<button class="pill" data-c="${i}" aria-pressed="${st.change===i}">${c.track?`<code>${c.track}</code> · `:""}${md(c.touches.replace(/\s*\(`[^)]*`\)/,""))}</button>`).join("")}
  </section>
  <div class="scroll"><div class="stages">${D.stages.map(s=>{const r=runOf(s.id);
    const skills=s.tools.filter(t=>t[0]==="Skill").flatMap(t=>codes(t[1]));
    const judges=[...s.judges.flatMap(j=>codes(j[0]))];
    return `<button class="stage ${r.cls==="off"?"off":""} ${r.cls==="outside"?"outside":""}" data-s="${s.id}" aria-pressed="${s.id===st.sel}">
      <span class="mono muted" style="font-size:.7rem">${String(s.n).padStart(2,"0")}</span>
      <span class="name">${s.id}</span><span class="mode ${isHuman(s.mode)?"h":""}">${md(s.mode)}</span>
      <span class="chips">${skills.map(k=>`<span class="chip">${esc(k)}</span>`).join("")}</span>
      ${judges.length?`<span class="chips">${judges.map(k=>`<span class="chip j">${esc(k)}</span>`).join("")}</span>`:""}
      ${r.txt?`<span class="runs ${r.cls==="partial"?"partial":""}">${md(r.txt)}</span>`:""}</button>`;}).join("")}</div>
    <svg width="${n*W}" height="215" viewBox="0 0 ${n*W} 215" role="img" aria-label="Inputs between stages">${arcs}${dots}</svg>
  </div>
  <div class="flowhint" id="flowhint">Hover or tap an arc to read what flows.</div>
  <section class="panel" id="panel"></section>`;
  panel();
}
function panel(){
  const s=D.stages.find(x=>x.id===st.sel), r=runOf(s.id);
  const feeds=D.flows.filter(f=>f.from===s.id), gets=D.flows.filter(f=>f.to===s.id);
  $("#panel").innerHTML=`<div class="col">
      <div><span class="label">Stage ${s.n} · ${md(s.mode)}</span><h2 class="mono">${s.id}</h2></div>
      <p>${md(s.what||s.does)}</p>
      ${r.txt?`<p><span class="label">In this change</span><br>${md(r.txt)}</p>`:""}
      <div><span class="label">Inputs</span>${table(s.inputs,["What","From"])}</div>
      <div><span class="label">Outputs</span>${table(s.outputs,["What","Anchored to / where"])}</div>
      <div><span class="label">Feeds</span><p class="muted" style="font-size:.86rem">${feeds.length?[...new Set(feeds.map(f=>f.to))].map(x=>`<code>${x}</code>`).join(" · "):"No stage declares an input from this one"}</p></div>
    </div>
    <div class="col">
      <div><span class="label">Judge</span>${s.judges.length?table(s.judges,["Agent","Checks","Passes when"]):""}${s.judgeText?`<p style="font-size:.88rem;margin-top:6px">${md(s.judgeText)}</p>`:""}</div>
      <div><span class="label">Skills, agents and tools</span>${table(s.tools,["Kind","Name","For"])}</div>
      <div><span class="label">Per track</span>${s.perTrack===null?`<p class="muted" style="font-size:.86rem">This PRD has no "Per track" section.</p>`:table(s.perTrack,["Track","What changes"])}</div>
      <p class="muted" style="font-size:.8rem">Source: <code>${s.path}</code></p>
    </div>`;
  document.querySelectorAll(".arc").forEach(a=>a.classList.toggle("hl",a.dataset.from===s.id||a.dataset.to===s.id));
}

/* ---------------- Concepts ---------------- */
const layers=[...new Set(D.docs.map(d=>d.layer))];
const layerColor=Object.fromEntries(layers.map((l,i)=>[l,`var(--l${i%11+1})`]));
const cs={hidden:new Set(),sel:null,q:"",pos:null,view:null};
function layout(){
  const N=D.docs.length, byPath=Object.fromEntries(D.docs.map((d,i)=>[d.path,i]));
  const E=[];D.docs.forEach((d,i)=>d.links.forEach(l=>E.push([i,byPath[l.to],l.n])));
  const centers=Object.fromEntries(layers.map((l,i)=>[l,[Math.cos(i/layers.length*6.283)*230,Math.sin(i/layers.length*6.283)*200]]));
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const P=D.docs.map(d=>{const c=centers[d.layer];return {x:c[0]+rnd()*80-40,y:c[1]+rnd()*80-40,vx:0,vy:0};});
  for(let it=0;it<320;it++){
    const t=1-it/320;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      let dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d2=dx*dx+dy*dy+.01;if(d2>90000)continue;
      const f=700/d2;P[i].vx+=dx*f;P[i].vy+=dy*f;P[j].vx-=dx*f;P[j].vy-=dy*f;}
    for(const [a,b] of E){const dx=P[b].x-P[a].x,dy=P[b].y-P[a].y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-55)*.016;
      P[a].vx+=dx/d*f*d*.05;P[a].vy+=dy/d*f*d*.05;P[b].vx-=dx/d*f*d*.05;P[b].vy-=dy/d*f*d*.05;}
    D.docs.forEach((d,i)=>{const c=centers[d.layer];P[i].vx+=(c[0]-P[i].x)*.03;P[i].vy+=(c[1]-P[i].y)*.03;
      const cap=12*t+1;P[i].x+=Math.max(-cap,Math.min(cap,P[i].vx));P[i].y+=Math.max(-cap,Math.min(cap,P[i].vy));P[i].vx*=.5;P[i].vy*=.5;});
  }
  const xs=P.map(p=>p.x),ys=P.map(p=>p.y),pad=60;
  cs.view=[Math.min(...xs)-pad,Math.min(...ys)-pad,Math.max(...xs)-Math.min(...xs)+pad*2,Math.max(...ys)-Math.min(...ys)+pad*2];
  cs.pos=P;cs.E=E;
}
function concepts(){
  if(!cs.pos) layout();
  $("#main").innerHTML=`
  <section class="intro"><span class="label">Concepts · every document of the spec and every link between them</span>
    <h1>How the spec holds together</h1>
    <p class="muted">Each dot is a document; its size is how many others link to it. Drag to move, scroll or pinch to zoom, tap a dot to see what it is and what it touches.</p></section>
  <section class="chips" role="group" aria-label="Layers">${layers.map(l=>`<button class="pill layer" data-l="${l}" aria-pressed="${!cs.hidden.has(l)}"><span class="sw" style="background:${layerColor[l]}"></span>${l}</button>`).join("")}
    <input type="search" id="q" placeholder="Find a document or ID" value="${esc(cs.q)}" aria-label="Find a document or ID"></section>
  <div class="graphwrap"><div class="graph" id="graph"></div><aside class="side" id="side"></aside></div>`;
  drawGraph();side();
}
function drawGraph(){
  const P=cs.pos, q=cs.q.toLowerCase();
  const vis=i=>!cs.hidden.has(D.docs[i].layer);
  const match=i=>!q||(D.docs[i].title+" "+D.docs[i].ids.join(" ")+" "+D.docs[i].path).toLowerCase().includes(q);
  const selI=cs.sel==null?-1:D.docs.findIndex(d=>d.path===cs.sel);
  const near=new Set();if(selI>=0){near.add(selI);cs.E.forEach(([a,b])=>{if(a===selI)near.add(b);if(b===selI)near.add(a);});}
  const edges=cs.E.filter(([a,b])=>vis(a)&&vis(b)).map(([a,b])=>{const hl=selI>=0&&(a===selI||b===selI);
    return `<line class="edge ${hl?"hl":selI>=0?"dim":""}" x1="${P[a].x}" y1="${P[a].y}" x2="${P[b].x}" y2="${P[b].y}"/>`;}).join("");
  const nodes=D.docs.map((d,i)=>{if(!vis(i))return"";const r=4+Math.sqrt(d.incoming)*2.2;
    const dim=(selI>=0&&!near.has(i))||(q&&!match(i));
    const label=d.incoming>=6||near.has(i)||(q&&match(i));
    return `<g class="node ${dim?"dim":""}" data-p="${esc(d.path)}"><circle cx="${P[i].x}" cy="${P[i].y}" r="${r}" fill="${layerColor[d.layer]}"><title>${esc(d.title)}</title></circle>${label?`<text x="${P[i].x+r+3}" y="${P[i].y+3}">${esc(d.title)}</text>`:""}</g>`;}).join("");
  $("#graph").innerHTML=`<svg viewBox="${cs.view.join(" ")}" id="gsvg" role="img" aria-label="Graph of the spec's documents">${edges}${nodes}</svg>`;
  panzoom($("#gsvg"));
}
function panzoom(svg){
  let drag=null;
  svg.addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;drag={x:e.clientX,y:e.clientY,v:[...cs.view]};svg.setPointerCapture(e.pointerId);});
  svg.addEventListener("pointermove",e=>{if(!drag)return;const k=cs.view[2]/svg.clientWidth;
    cs.view[0]=drag.v[0]-(e.clientX-drag.x)*k;cs.view[1]=drag.v[1]-(e.clientY-drag.y)*k;svg.setAttribute("viewBox",cs.view.join(" "));});
  svg.addEventListener("pointerup",()=>drag=null);
  svg.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY>0?1.12:1/1.12,rect=svg.getBoundingClientRect();
    const mx=cs.view[0]+(e.clientX-rect.left)/rect.width*cs.view[2],my=cs.view[1]+(e.clientY-rect.top)/rect.height*cs.view[3];
    cs.view=[mx-(mx-cs.view[0])*f,my-(my-cs.view[1])*f,cs.view[2]*f,cs.view[3]*f];svg.setAttribute("viewBox",cs.view.join(" "));},{passive:false});
}
function side(){
  const d=D.docs.find(x=>x.path===cs.sel);
  if(!d){const top=[...D.docs].sort((a,b)=>b.incoming-a.incoming).slice(0,10);
    $("#side").innerHTML=`<span class="label">${D.docs.length} documents · ${cs.E.length} links</span><h3>Most linked</h3>
    <ul>${top.map(t=>`<li><a data-go="${esc(t.path)}">${esc(t.title)}</a> <span class="muted">· ${t.incoming}</span></li>`).join("")}</ul>`;return;}
  const inc=D.docs.filter(x=>x.links.some(l=>l.to===d.path));
  $("#side").innerHTML=`<span class="label"><span class="sw" style="background:${layerColor[d.layer]}"></span>${d.layer}${d.status?" · "+d.status:""}</span>
    <h3>${esc(d.title)}</h3><p style="font-size:.88rem">${md(d.description)}</p>
    ${d.ids.length?`<div class="chips">${d.ids.map(i=>`<span class="chip">${i}</span>`).join("")}</div>`:""}
    <p class="muted mono" style="font-size:.75rem">${esc(d.path)} · v${esc(d.version)} · ${esc(d.updated)}</p>
    <span class="label">Links to ${d.links.length}</span><ul>${d.links.map(l=>{const t=D.docs.find(x=>x.path===l.to);return `<li><a data-go="${esc(l.to)}">${esc(t.title)}</a></li>`;}).join("")||"<li class='muted'>None</li>"}</ul>
    <span class="label">Linked from ${inc.length}</span><ul>${inc.map(t=>`<li><a data-go="${esc(t.path)}">${esc(t.title)}</a></li>`).join("")||"<li class='muted'>None</li>"}</ul>
    <a data-go="">Clear selection</a>`;
}

/* ---------------- Architecture ---------------- */
function architecture(){
  const doesOf=name=>D.pieces.find(p=>p.piece.replace(/`[^`]*`/g,"").trim().toLowerCase()===name.toLowerCase()||p.piece.toLowerCase().startsWith(name.toLowerCase()));
  $("#main").innerHTML=`
  <section class="intro"><span class="label">Architecture · from foundations/architecture/overview.md and the ARCH documents</span>
    <h1>The pieces, and what each one does</h1>
    <p class="muted">The open framework runs on your machine when you ask. The Cloud watches all the time, across systems. Both are drawn from the same overview.</p></section>
  <section class="tier cloud"><span class="label">OpenPEDD Cloud · paid</span>
    <div class="chips">${D.cloud.map(c=>`<span class="chip j">${esc(c)}</span>`).join("")}</div></section>
  <div class="ext" aria-label="External systems"><span class="muted">connects to</span>${D.external.map(e=>`<span>${esc(e)}</span>`).join("")}</div>
  <section class="tier"><span class="label">OpenPEDD · open source</span>
    <div class="grid">${D.openLayers.map(l=>{const p=doesOf(l.name);return `<div class="piece"><span class="label">${l.n}</span><b>${esc(l.name)}</b>
      ${p?`<span style="font-size:.86rem">${md(p.does)}</span>`:""}<span class="muted" style="font-size:.78rem">${md(l.items)}</span></div>`;}).join("")}</div></section>
  <section style="display:flex;flex-direction:column;gap:10px"><h2>Architecture documents</h2>
    <div class="grid">${D.archDocs.map(d=>`<div class="piece"><span class="label">${d.ids[0]}</span><b style="font-family:var(--display);font-size:.95rem">${esc(d.title)}</b><span style="font-size:.84rem" class="muted">${md(d.description)}</span></div>`).join("")}</div></section>`;
}

/* ---------------- Gaps ---------------- */
function gaps(){
  $("#main").innerHTML=`
  <section class="intro"><span class="label">Gaps · computed when the map is built</span>
    <h1>What the spec says about itself that does not add up</h1>
    <p class="muted">Each line compares two places in the spec that should agree: the tracks table and each stage's PRD, the published skill and judge lists and each PRD, and documents nothing links to. A gap is a question for <code>specify</code>, not a verdict.</p></section>
  <section style="display:flex;flex-direction:column;gap:8px">${D.gaps.length?D.gaps.map(g=>`<div class="gap"><span class="k">${g.kind}</span><div><div>${md(g.text)}</div><div class="muted mono" style="font-size:.75rem">${esc(g.where)}</div></div></div>`).join(""):"<p>No gaps found.</p>"}</section>`;
}

/* ---------------- Routing and events ---------------- */
const views={process,concepts,architecture,gaps};
function route(){
  const v=views[location.hash.slice(1)]?location.hash.slice(1):"process";
  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));
  views[v]();
}
document.querySelector('nav a[href="#gaps"]').insertAdjacentHTML("beforeend",D.gaps.length?`<span class="n">${D.gaps.length}</span>`:"");
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-c]");if(c){st.change=+c.dataset.c;process();return;}
  const s=e.target.closest("[data-s]");if(s){st.sel=s.dataset.s;document.querySelectorAll(".stage").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===st.sel));panel();return;}
  const l=e.target.closest("[data-l]");if(l){cs.hidden.has(l.dataset.l)?cs.hidden.delete(l.dataset.l):cs.hidden.add(l.dataset.l);l.setAttribute("aria-pressed",!cs.hidden.has(l.dataset.l));drawGraph();return;}
  const n=e.target.closest(".node");if(n){cs.sel=n.dataset.p;drawGraph();side();return;}
  const g=e.target.closest("[data-go]");if(g){cs.sel=g.dataset.go||null;drawGraph();side();return;}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){cs.q=e.target.value;drawGraph();}});
const hint=e=>{const a=e.target.closest(".arc");if(!a)return;const f=D.flows[a.dataset.k];
  $("#flowhint").innerHTML=`<code>${f.from}</code> → <code>${f.to}</code>: ${md(f.what)}`;};
document.addEventListener("mouseover",hint);document.addEventListener("click",hint);
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
